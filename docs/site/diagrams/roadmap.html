<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent OS roadmap</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #2E3440;   /* Nord nord0 */
      --color-ink:     #ECEFF4;   /* Nord nord6 */
      --color-muted:   #D8DEE9;   /* Nord nord4 */
      --color-soft:    #9AA5B8;
      --color-accent:  #EBCB8B;   /* Nord nord13 */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1280px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-soft);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 1280px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Timeline · Agent OS</p>
    <h1>Roadmap</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="roadmap-title roadmap-desc">
        <title id="roadmap-title">Agent OS roadmap</title>
        <desc id="roadmap-desc">Timeline showing the shipped Continuity foundation from July to November 2026, the current step of defining the MVP and building the first screen, then the planned Brain memory, team coordination, and a later self-improvement loop, in order but not yet dated.</desc>

        <rect width="100%" height="100%" fill="#2E3440"/>

        <!-- AXIS: dated part (to scale, 80px per month from Jul 1) -->
        <line x1="80" y1="352" x2="432" y2="352" stroke="#ECEFF4" stroke-width="3"/>
        <!-- AXIS: undated part (order only) -->
        <line x1="448" y1="352" x2="532" y2="352" stroke="rgba(236,239,244,0.40)" stroke-width="1" stroke-dasharray="5,4"/>
        <line x1="536" y1="360" x2="544" y2="344" stroke="#9AA5B8" stroke-width="1"/>
        <line x1="544" y1="360" x2="552" y2="344" stroke="#9AA5B8" stroke-width="1"/>
        <line x1="556" y1="352" x2="1200" y2="352" stroke="rgba(236,239,244,0.40)" stroke-width="1" stroke-dasharray="5,4"/>

        <!-- Month ticks -->
        <line x1="80" y1="340" x2="80" y2="364" stroke="rgba(236,239,244,0.40)" stroke-width="1"/>
        <line x1="160" y1="344" x2="160" y2="360" stroke="rgba(236,239,244,0.40)" stroke-width="1"/>
        <line x1="240" y1="344" x2="240" y2="360" stroke="rgba(236,239,244,0.40)" stroke-width="1"/>
        <line x1="320" y1="344" x2="320" y2="360" stroke="rgba(236,239,244,0.40)" stroke-width="1"/>
        <line x1="400" y1="344" x2="400" y2="360" stroke="rgba(236,239,244,0.40)" stroke-width="1"/>
        <text x="80" y="380" fill="#9AA5B8" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">JUL 2026</text>
        <text x="160" y="380" fill="#9AA5B8" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">AUG</text>
        <text x="240" y="380" fill="#9AA5B8" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">SEP</text>
        <text x="320" y="380" fill="#9AA5B8" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">OCT</text>
        <text x="400" y="380" fill="#9AA5B8" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">NOV</text>
        <text x="572" y="380" fill="#9AA5B8" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">NO DATES YET — ORDER ONLY</text>

        <!-- STEMS -->
        <line x1="256" y1="284" x2="256" y2="344" stroke="rgba(236,239,244,0.30)" stroke-width="1"/>
        <line x1="440" y1="362" x2="440" y2="404" stroke="rgba(236,239,244,0.30)" stroke-width="1"/>
        <line x1="680" y1="284" x2="680" y2="344" stroke="rgba(236,239,244,0.30)" stroke-width="1"/>
        <line x1="880" y1="360" x2="880" y2="404" stroke="rgba(236,239,244,0.30)" stroke-width="1"/>
        <line x1="1080" y1="284" x2="1080" y2="344" stroke="rgba(236,239,244,0.30)" stroke-width="1"/>

        <!-- MARKERS: filled = shipped, ring = next, dashed outline = planned/later -->
        <circle cx="256" cy="352" r="7" fill="#ECEFF4" stroke="#2E3440" stroke-width="2"/>
        <circle cx="440" cy="352" r="8" fill="#2E3440" stroke="#EBCB8B" stroke-width="2.4"/>
        <circle cx="680" cy="352" r="7" fill="#2E3440" stroke="#D8DEE9" stroke-width="1.4" stroke-dasharray="3,2"/>
        <circle cx="880" cy="352" r="7" fill="#2E3440" stroke="#D8DEE9" stroke-width="1.4" stroke-dasharray="3,2"/>
        <circle cx="1080" cy="352" r="7" fill="#2E3440" stroke="#D8DEE9" stroke-width="1.4" stroke-dasharray="3,2"/>

        <!-- YOU ARE HERE (the only accent) -->
        <text x="440" y="328" fill="#EBCB8B" font-size="8" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">YOU ARE HERE ▾</text>

        <!-- 1. Foundation (above) -->
        <text x="256" y="182" fill="#D8DEE9" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">SHIPPED · JUL–NOV 2026</text>
        <text x="256" y="204" fill="#ECEFF4" font-size="14" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Foundation — “Continuity”</text>
        <text x="256" y="224" fill="#D8DEE9" font-size="11" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Agents remember where you left off</text>
        <text x="256" y="240" fill="#D8DEE9" font-size="11" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Claude Code + Codex share it</text>
        <text x="256" y="256" fill="#D8DEE9" font-size="11" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Inventory of every skill and tool</text>
        <text x="256" y="272" fill="#D8DEE9" font-size="11" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Provisioning · always-on server</text>

        <!-- 2. MVP definition + first screen (below, NEXT) -->
        <text x="440" y="424" fill="#ECEFF4" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">NEXT · NOW</text>
        <text x="440" y="446" fill="#ECEFF4" font-size="14" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">MVP definition + first screen</text>
        <text x="440" y="466" fill="#D8DEE9" font-size="11" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Decide what the MVP is,</text>
        <text x="440" y="482" fill="#D8DEE9" font-size="11" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">then build the first app screen</text>

        <!-- 3. The Brain (above, PLANNED) -->
        <text x="680" y="198" fill="#9AA5B8" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">PLANNED</text>
        <text x="680" y="220" fill="#ECEFF4" font-size="14" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">The Brain — real memory</text>
        <text x="680" y="240" fill="#D8DEE9" font-size="11" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Long-term knowledge: wiki,</text>
        <text x="680" y="256" fill="#D8DEE9" font-size="11" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">deep archive, auto-ingestion</text>
        <text x="680" y="272" fill="#D8DEE9" font-size="11" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Ask any agent about months-old work</text>

        <!-- 4. Team coordination (below, PLANNED) -->
        <text x="880" y="424" fill="#9AA5B8" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">PLANNED</text>
        <text x="880" y="446" fill="#ECEFF4" font-size="14" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Team coordination</text>
        <text x="880" y="466" fill="#D8DEE9" font-size="11" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">One task board across harnesses</text>
        <text x="880" y="482" fill="#D8DEE9" font-size="11" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Hermes as chief of staff,</text>
        <text x="880" y="498" fill="#D8DEE9" font-size="11" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">dispatching the work</text>

        <!-- 5. Self-improvement loop (above, LATER) -->
        <text x="1080" y="198" fill="#9AA5B8" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">LATER</text>
        <text x="1080" y="220" fill="#ECEFF4" font-size="14" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Self-improvement loop</text>
        <text x="1080" y="240" fill="#D8DEE9" font-size="11" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Watches the metrics,</text>
        <text x="1080" y="256" fill="#D8DEE9" font-size="11" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">recommends and runs the</text>
        <text x="1080" y="272" fill="#D8DEE9" font-size="11" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">next best improvements</text>

        <!-- LEGEND -->
        <line x1="40" y1="652" x2="1240" y2="652" stroke="rgba(236,239,244,0.10)" stroke-width="0.8"/>
        <text x="40" y="684" fill="#9AA5B8" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text>

        <circle cx="124" cy="680" r="6" fill="#ECEFF4"/>
        <text x="138" y="684" fill="#D8DEE9" font-size="10" font-family="'Geist', system-ui, sans-serif">Filled: shipped</text>

        <circle cx="264" cy="680" r="7" fill="#2E3440" stroke="#EBCB8B" stroke-width="2.4"/>
        <text x="280" y="684" fill="#D8DEE9" font-size="10" font-family="'Geist', system-ui, sans-serif">Ring: next — you are here</text>

        <circle cx="452" cy="680" r="6" fill="#2E3440" stroke="#D8DEE9" stroke-width="1.4" stroke-dasharray="3,2"/>
        <text x="466" y="684" fill="#D8DEE9" font-size="10" font-family="'Geist', system-ui, sans-serif">Dashed ring: planned or later</text>

        <line x1="652" y1="680" x2="684" y2="680" stroke="#ECEFF4" stroke-width="3"/>
        <text x="692" y="684" fill="#D8DEE9" font-size="10" font-family="'Geist', system-ui, sans-serif">Solid axis: dated, to scale</text>

        <line x1="860" y1="680" x2="892" y2="680" stroke="rgba(236,239,244,0.40)" stroke-width="1" stroke-dasharray="5,4"/>
        <text x="900" y="684" fill="#D8DEE9" font-size="10" font-family="'Geist', system-ui, sans-serif">Dashed axis: order only, no dates</text>
      </svg>
    </div>
  </div>
</body>
</html>
