# Claude auto-reviews every same-repo PR on open and on every push, on Jarod's
# Claude Max subscription (OAuth token from `claude setup-token`), never an API key.
# Plan: docs/plans/2026-10-30-1306-feat-automated-pr-review-plan.md (U1; R1, R4-R6; KTD1-KTD5).
#
# Comment-only: this is not a required check, and Jarod remains the merge gate.
# The Claude GitHub App rejects a run whose workflow file differs from the
# default branch's copy, so a PR that edits this file gets no Claude review of
# itself. Accepted risk (DECISIONS #61): anyone who can push a branch here can
# reach the token by editing this file in their PR.
name: Claude PR review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Fork PRs get no repo secrets; skip them instead of erroring on the missing token.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Claude review
        uses: anthropics/claude-code-action@6d5ae526d25ce88daa2200be073e1a373167f064 # v1.0.265
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Tag mode: one claude[bot] tracking comment holds the summary and is
          # updated in place on every push (a bare prompt runs agent mode, which
          # has no tracking comment for use_sticky_comment to reuse).
          track_progress: true
          use_sticky_comment: true
          # Its post-step needs an Anthropic API key, which R1 forbids.
          classify_inline_comments: "false"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request's diff. Look for:
            - correctness bugs and logic errors
            - security problems
            - regressions in existing behavior
            - changed behavior with no test covering it

            Report only high-signal findings, each as an inline comment on the
            line it concerns. Skip style nits and preferences. Put a short
            overall summary in your tracking comment. If you find nothing worth
            flagging, say so in one line.
          claude_args: |
            --model sonnet
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*)"
