<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>How it fits together</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #2E3440;   /* Nord nord0 */
      --color-ink:     #ECEFF4;   /* Nord nord6 */
      --color-muted:   #D8DEE9;   /* Nord nord4 */
      --color-soft:    #9AA5B8;
      --color-accent:  #EBCB8B;   /* Nord nord13 */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1280px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-soft);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 1280px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Agent OS</p>
    <h1>How it fits together</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="how-it-fits-title how-it-fits-desc">
        <title id="how-it-fits-title">How Agent OS fits together</title>
        <desc id="how-it-fits-desc">Architecture showing you and your agent harnesses connecting to an always-on brain server on your Mac, which holds shared memory, an inventory of the skills and tool, and provisioning, with a planned first app screen that will show all of it.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#D8DEE9"/></marker>
          <marker id="arrow-two" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polygon points="0 0, 8 3, 0 6" fill="#D8DEE9"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EBCB8B"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polygon points="0 0, 8 3, 0 6" fill="#88C0D0"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#2E3440"/>

        <!-- ZONE: Your Mac, always on (boundary, dashed) -->
        <rect x="280" y="88" width="960" height="528" rx="8" fill="rgba(236,239,244,0.02)" stroke="rgba(236,239,244,0.30)" stroke-width="1" stroke-dasharray="4,4"/>
        <rect x="292" y="82" width="128" height="12" rx="2" fill="#2E3440"/>
        <text x="300" y="91" fill="#9AA5B8" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">YOUR MAC — ALWAYS ON</text>

        <!-- CONTAINER: Brain server (painted as a container, before arrows) -->
        <rect x="384" y="168" width="504" height="424" rx="8" fill="#3B4252" stroke="#ECEFF4" stroke-width="1"/>
        <rect x="404" y="184" width="40" height="12" rx="2" fill="transparent" stroke="rgba(236,239,244,0.40)" stroke-width="0.8"/>
        <text x="424" y="193" fill="#D8DEE9" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">LOCAL</text>
        <text x="404" y="218" fill="#ECEFF4" font-size="14" font-weight="600" font-family="'Geist', system-ui, sans-serif">Brain server</text>
        <text x="404" y="236" fill="#D8DEE9" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">starts at login · restarts itself · locked to this machine</text>

        <!-- ARROWS (before nodes) -->
        <!-- You -> Provisioning : CLI -->
        <line x1="264" y1="280" x2="412" y2="280" stroke="#D8DEE9" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Harnesses <-> Brain server : MCP tools (two-way, link) -->
        <line x1="264" y1="476" x2="384" y2="476" stroke="#88C0D0" stroke-width="1.2" marker-start="url(#arrow-link)" marker-end="url(#arrow-link)"/>
        <!-- Harnesses <-> Brain server : session hooks (two-way) -->
        <line x1="264" y1="508" x2="384" y2="508" stroke="#D8DEE9" stroke-width="1.2" marker-start="url(#arrow-two)" marker-end="url(#arrow-two)"/>
        <!-- You -> First screen (planned, dashed, routed above the server) -->
        <path d="M152,252 V136 Q152,128 160,128 H1068 Q1076,128 1076,136 V332" fill="none" stroke="#D8DEE9" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <!-- Brain server -> First screen (planned, dashed) -->
        <line x1="888" y1="368" x2="952" y2="368" stroke="#D8DEE9" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

        <!-- ARROW LABELS -->
        <rect x="318" y="262" width="28" height="12" rx="2" fill="#2E3440"/>
        <text x="332" y="271" fill="#9AA5B8" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">CLI</text>

        <rect x="304" y="458" width="56" height="12" rx="2" fill="#2E3440"/>
        <text x="332" y="467" fill="#88C0D0" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">MCP TOOLS</text>

        <rect x="294" y="490" width="76" height="12" rx="2" fill="#2E3440"/>
        <text x="332" y="499" fill="#9AA5B8" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">SESSION HOOKS</text>

        <rect x="580" y="110" width="80" height="12" rx="2" fill="#2E3440"/>
        <text x="620" y="119" fill="#9AA5B8" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">YOU'LL USE IT</text>

        <rect x="900" y="350" width="40" height="12" rx="2" fill="#2E3440"/>
        <text x="920" y="359" fill="#9AA5B8" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">SHOWS</text>

        <!-- NODES -->
        <!-- You (input) -->
        <rect x="40" y="252" width="224" height="56" rx="6" fill="#2E3440"/>
        <rect x="40" y="252" width="224" height="56" rx="6" fill="rgba(216,222,233,0.10)" stroke="#9AA5B8" stroke-width="1"/>
        <rect x="48" y="258" width="28" height="12" rx="2" fill="transparent" stroke="rgba(154,165,184,0.60)" stroke-width="0.8"/>
        <text x="62" y="267" fill="#9AA5B8" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">YOU</text>
        <text x="152" y="286" fill="#ECEFF4" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">You</text>
        <text x="152" y="300" fill="#D8DEE9" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">the operator</text>

        <!-- Your agent harnesses (external) -->
        <rect x="40" y="444" width="224" height="96" rx="6" fill="#2E3440"/>
        <rect x="40" y="444" width="224" height="96" rx="6" fill="rgba(236,239,244,0.03)" stroke="rgba(236,239,244,0.30)" stroke-width="1"/>
        <rect x="48" y="450" width="44" height="12" rx="2" fill="transparent" stroke="rgba(236,239,244,0.30)" stroke-width="0.8"/>
        <text x="70" y="459" fill="#9AA5B8" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">AGENTS</text>
        <text x="152" y="486" fill="#ECEFF4" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Your agent harnesses</text>
        <text x="152" y="504" fill="#D8DEE9" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">memory: Claude Code · Codex</text>
        <text x="152" y="520" fill="#9AA5B8" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">setup only: Cursor · more later</text>

        <!-- Provisioning (inside server) -->
        <rect x="412" y="248" width="448" height="64" rx="6" fill="#2E3440"/>
        <rect x="412" y="248" width="448" height="64" rx="6" fill="rgba(236,239,244,0.05)" stroke="#D8DEE9" stroke-width="1"/>
        <rect x="420" y="254" width="36" height="12" rx="2" fill="transparent" stroke="rgba(216,222,233,0.40)" stroke-width="0.8"/>
        <text x="438" y="263" fill="#D8DEE9" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">SETUP</text>
        <text x="636" y="284" fill="#ECEFF4" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Provisioning</text>
        <text x="636" y="300" fill="#D8DEE9" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">one blueprint → sets up each harness natively, with undo</text>

        <!-- Inventory (inside server) -->
        <rect x="412" y="336" width="448" height="64" rx="6" fill="#2E3440"/>
        <rect x="412" y="336" width="448" height="64" rx="6" fill="rgba(236,239,244,0.05)" stroke="#D8DEE9" stroke-width="1"/>
        <rect x="420" y="342" width="36" height="12" rx="2" fill="transparent" stroke="rgba(216,222,233,0.40)" stroke-width="0.8"/>
        <text x="438" y="351" fill="#D8DEE9" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">SEES</text>
        <text x="636" y="372" fill="#ECEFF4" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Inventory</text>
        <text x="636" y="388" fill="#D8DEE9" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">skills · MCP servers · plugins · shown in first screen</text>

        <!-- Shared memory (FOCAL) -->
        <rect x="412" y="424" width="448" height="136" rx="6" fill="#2E3440"/>
        <rect x="412" y="424" width="448" height="136" rx="6" fill="rgba(235,203,139,0.10)" stroke="#EBCB8B" stroke-width="1.2"/>
        <rect x="420" y="430" width="48" height="12" rx="2" fill="transparent" stroke="rgba(235,203,139,0.50)" stroke-width="0.8"/>
        <text x="444" y="439" fill="#EBCB8B" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">MEMORY</text>
        <text x="636" y="470" fill="#ECEFF4" font-size="14" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Shared memory</text>
        <text x="636" y="492" fill="#D8DEE9" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">“where we left off” handoffs</text>
        <text x="636" y="508" fill="#D8DEE9" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">+ session-end markers · breadcrumbs: not on yet</text>
        <text x="636" y="532" fill="#EBCB8B" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">secrets masked on every read</text>

        <!-- First screen (planned, optional/dashed) -->
        <rect x="952" y="332" width="248" height="72" rx="6" fill="#2E3440"/>
        <rect x="952" y="332" width="248" height="72" rx="6" fill="rgba(236,239,244,0.02)" stroke="rgba(236,239,244,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
        <rect x="960" y="338" width="52" height="12" rx="2" fill="transparent" stroke="rgba(236,239,244,0.30)" stroke-width="0.8" stroke-dasharray="2,2"/>
        <text x="986" y="347" fill="#9AA5B8" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">PLANNED</text>
        <text x="1076" y="372" fill="#ECEFF4" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">First screen</text>
        <text x="1076" y="388" fill="#D8DEE9" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">the app that shows all of this</text>

        <!-- LEGEND (bottom strip) -->
        <line x1="40" y1="652" x2="1240" y2="652" stroke="rgba(236,239,244,0.10)" stroke-width="0.8"/>
        <text x="40" y="684" fill="#9AA5B8" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text>

        <rect x="112" y="675" width="20" height="12" rx="2" fill="rgba(235,203,139,0.10)" stroke="#EBCB8B" stroke-width="1.2"/>
        <text x="140" y="684" fill="#D8DEE9" font-size="10" font-family="'Geist', system-ui, sans-serif">Focal: shared memory</text>

        <rect x="276" y="675" width="20" height="12" rx="2" fill="rgba(236,239,244,0.05)" stroke="#D8DEE9" stroke-width="1"/>
        <text x="304" y="684" fill="#D8DEE9" font-size="10" font-family="'Geist', system-ui, sans-serif">Runs on your Mac today</text>

        <rect x="448" y="675" width="20" height="12" rx="2" fill="rgba(216,222,233,0.10)" stroke="#9AA5B8" stroke-width="1"/>
        <text x="476" y="684" fill="#D8DEE9" font-size="10" font-family="'Geist', system-ui, sans-serif">You and your tools</text>

        <rect x="600" y="675" width="20" height="12" rx="2" fill="rgba(236,239,244,0.02)" stroke="rgba(236,239,244,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="628" y="684" fill="#D8DEE9" font-size="10" font-family="'Geist', system-ui, sans-serif">Dashed box: planned</text>

        <line x1="760" y1="681" x2="792" y2="681" stroke="#88C0D0" stroke-width="1.2" marker-start="url(#arrow-link)" marker-end="url(#arrow-link)"/>
        <text x="800" y="684" fill="#D8DEE9" font-size="10" font-family="'Geist', system-ui, sans-serif">MCP tool calls, two-way</text>

        <line x1="940" y1="681" x2="972" y2="681" stroke="#D8DEE9" stroke-width="1.2"/>
        <text x="980" y="684" fill="#D8DEE9" font-size="10" font-family="'Geist', system-ui, sans-serif">Solid line: works today</text>

        <line x1="1104" y1="681" x2="1136" y2="681" stroke="#D8DEE9" stroke-width="1" stroke-dasharray="5,4"/>
        <text x="1144" y="684" fill="#D8DEE9" font-size="10" font-family="'Geist', system-ui, sans-serif">Dashed: planned</text>
      </svg>
    </div>
  </div>
</body>
</html>
